name: Test and Deploy to GitHub Pages

on:
  push:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  test-portfolio:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Check for required website files
      run: |
        required="index.html projects.html contact.html style.css favicon.svg"
        missing=0
        for file in $required; do
          if [ ! -f "$file" ]; then
            echo "Error: $file is missing!"
            missing=1
          fi
        done
        exit "$missing"

  deploy:
    needs: test-portfolio
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Pages
      uses: actions/configure-pages@v5

    - name: Upload website files as an artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: '.'

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4